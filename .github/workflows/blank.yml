# ❌ THIS CAUSES PARALLEL EXECUTION - For reference only
name: Snapshot Pipeline - #5

stages:
  - name: pipeline_config_load
    type: build_and_test
    order: 10
    steps:
      - name: load_config
        action: run_script
        script: load_pipeline_config.sh

  - name: build_snapshot_enterprise_intune
    type: manual          # ← CULPRIT #1: Manual type doesn't wait
    order: 10             # ← CULPRIT #2: Same order as above = parallel
    depends_on: []        # ← CULPRIT #3: No dependency defined
    steps:
      - name: build_snapshot
        action: run_script
        script: build_snapshot.sh

  - name: appdome_harden_snapshot
    type: deploy
    order: 30
    steps:
      - name: harden
        action: run_script
        script: harden_snapshot.sh
